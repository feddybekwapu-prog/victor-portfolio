const $ = (selector, parent = document) =>
  parent.querySelector(selector);

const $$ = (selector, parent = document) =>
  [...parent.querySelectorAll(selector)];

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function scrollToTop() {

/* ============================================================

let activeProjectFilter = "All";

function projectCategories() {
  return [
    "All",
    ...new Set(DATA.projects.map(project => project.category))
  ];
}

function renderProjectFilters() {
  const container = $("#project-filters");

  container.innerHTML = projectCategories()
    .map(category => `
      <button
        class="filter"
        type="button"
        data-project-filter="${escapeHTML(category)}"
        aria-pressed="${category === activeProjectFilter}"
      >
        ${escapeHTML(category)}
      </button>
    `)
    .join("");

  $$("[data-project-filter]", container).forEach(button => {
    button.addEventListener("click", () => {
      activeProjectFilter = button.dataset.projectFilter;
      renderProjectFilters();
      renderProjects();
    });
  });
}

function renderProjects() {
  const container = $("#project-grid");

  let projects = DATA.projects;

  if (activeProjectFilter !== "All") {
    projects = projects.filter(
      project => project.category === activeProjectFilter
    );
  }

  if (!projects.length) {
    container.innerHTML =
      `<p class="empty">No projects found in this category.</p>`;
    return;
  }

  container.innerHTML = projects
    .map(project => `
      <article class="pcard ${project.featured ? "is-featured" : ""}">
        <div class="pcard-cover" aria-hidden="true">
          <span class="cover-mark">${escapeHTML(project.cover)}</span>
        </div>

        <div class="pcard-body">
          <p class="pcard-client">${escapeHTML(project.client)}</p>

          <h3>
            <a href="#project/${encodeURIComponent(project.id)}">
              ${escapeHTML(project.title)}
            </a>
          </h3>

          <p>${escapeHTML(project.summary)}</p>

          <ul class="chips">

              <li class="chip">${escapeHTML(tag)}</li>

/* ============================================================
   REWRITE ANIMATION
   ============================================================ */

function replayRewrite() {
  const box = $(".rewrite");

  box.classList.remove("armed", "go");

  /*
   * Force the browser to recognise the reset before restarting
   * the animation.
   */
  void box.offsetWidth;

  box.classList.add("armed");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      box.classList.add("go");
    });
  });
}

function initRewrite() {
  $("#rw-replay").addEventListener("click", replayRewrite);

  /*
   * Start once when the page loads.
   */
  setTimeout(replayRewrite, 400);
}


/* ============================================================
   MOBILE NAVIGATION
   ============================================================ */

function initNavigation() {
  const toggle = $(".nav-toggle");
  const nav = $("#nav");

  toggle.addEventListener("click", () => {
    const isOpen = nav.classList.toggle("open");

    toggle.setAttribute(
      "aria-expanded",
      String(isOpen)
    );

    toggle.textContent = isOpen ? "Close" : "Menu";
  });

  $$("#nav a").forEach(link => {
    link.addEventListener("click", () => {
      nav.classList.remove("open");

      toggle.setAttribute(
        "aria-expanded",
        "false"
      );

      toggle.textContent = "Menu";
    });
  });
}


/* ============================================================

function getRoute() {
  const hash = window.location.hash.replace(/^#/, "");

  if (!hash) {
    return {
      type: "home",
      id: null
    };
  }

  const [type, ...rest] = hash.split("/");

  return {
    type,
    id: decodeURIComponent(rest.join("/"))
  };
}

function findProject(id) {
  return DATA.projects.find(project => project.id === id);
}

function findPost(id) {
  return DATA.posts.find(post => post.id === id);

/* ============================================================
   VIEW SWITCHING
   ============================================================ */

function showHome() {
  $("#home").hidden = false;
  $("#detail").hidden = true;

  document.title =
    "Victory Echi | Marketing & Brand Communications Strategist";
}

function showDetail() {
  $("#home").hidden = true;
  $("#detail").hidden = false;

  scrollToTop();
}

function handleRoute() {
  const route = getRoute();

  if (route.type === "home" || route.type === "") {
    showHome();
    return;
  }

  if (route.type === "project") {
    const project = findProject(route.id);

    if (project) {
      document.title =
        `${project.title} | Victory Echi`;

      renderProjectDetail(project);
    } else {
      renderNotFound();
    }

    return;
  }

  if (route.type === "post") {
    const post = findPost(route.id);

    if (post) {
      document.title =
        `${post.title} | Victory Echi`;

      renderPostDetail(post);
    } else {
      renderNotFound();
    }

    return;
  }

  renderNotFound();
}

window.addEventListener("hashchange", handleRoute);

  initNavigation();
  initRewrite();

  handleRoute();
}

if (document.readyState === "loading") {

} else {

}
